<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SandboxOS · Command Central</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
</head>
<body class="desktop">

<!-- Icon sprite. One place, referenced by <use href="#i-…">. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-console" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M6 8l2.5 2L6 12M11 12.5h3.5"/>
    </g>
    <g id="i-files" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 5.5a2 2 0 012-2h3l1.6 2h6.4a2 2 0 012 2v7a2 2 0 01-2 2h-11a2 2 0 01-2-2z"/>
    </g>
    <g id="i-shell" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 4.5h14M3 15.5h14M6.5 8l2 2-2 2M10.5 12h3"/>
    </g>
    <g id="i-agents" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="7" width="12" height="9" rx="2.5"/><path d="M10 4v3M7.5 11h.01M12.5 11h.01M2.5 10.5v2M17.5 10.5v2"/>
    </g>
    <g id="i-ports" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="7.2"/><path d="M2.8 10h14.4M10 2.8c1.9 2 2.9 4.5 2.9 7.2s-1 5.2-2.9 7.2c-1.9-2-2.9-4.5-2.9-7.2s1-5.2 2.9-7.2z"/>
    </g>
    <g id="i-jobs" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="7.2"/><path d="M10 5.8V10l2.8 1.8"/>
    </g>
    <g id="i-apps" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="6" height="6" rx="1.6"/><rect x="11" y="3" width="6" height="6" rx="1.6"/>
      <rect x="3" y="11" width="6" height="6" rx="1.6"/><rect x="11" y="11" width="6" height="6" rx="1.6"/>
    </g>
    <g id="i-secrets" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="7" cy="10" r="3.2"/><path d="M10.2 10H17M14.5 10v3M17 10v2.2"/>
    </g>
    <g id="i-metrics" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 16.5V9M7.7 16.5V4.5M12.3 16.5v-5M17 16.5V7.5"/>
    </g>
    <g id="i-settings" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="2.6"/>
      <path d="M10 2.6v2M10 15.4v2M17.4 10h-2M4.6 10h-2M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4M15.2 15.2l-1.4-1.4M6.2 6.2L4.8 4.8"/>
    </g>
    <g id="i-activity" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 10h3l2-5 3.5 10 2.5-5h4"/>
    </g>
    <g id="i-search" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8.8" cy="8.8" r="5.3"/><path d="M12.8 12.8L17 17"/>
    </g>
    <g id="i-refresh" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16.5 8.5a6.6 6.6 0 10-.6 4.6"/><path d="M16.8 4v4.6h-4.6"/>
    </g>
    <g id="i-plus" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></g>
    <g id="i-x" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></g>
    <g id="i-up" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 15.5V5M5.5 9.5L10 5l4.5 4.5"/>
    </g>
    <g id="i-down" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 4.5V15M5.5 10.5L10 15l4.5-4.5"/>
    </g>
    <g id="i-trash" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5.5h12M8 5.5V4h4v1.5M5.5 5.5l.8 10a1.5 1.5 0 001.5 1.4h4.4a1.5 1.5 0 001.5-1.4l.8-10"/>
    </g>
    <g id="i-theme" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 11.4A6.6 6.6 0 018.6 4a6.7 6.7 0 100 13.4 6.6 6.6 0 007.4-6z"/>
    </g>
    <g id="i-play" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4.5l9 5.5-9 5.5z"/></g>
    <g id="i-stop" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="5.5" y="5.5" width="9" height="9" rx="1.5"/></g>
    <g id="i-save" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4.5h9L16 7.5v8a1 1 0 01-1 1H5a1 1 0 01-1-1z"/><path d="M7 4.5v4h5v-4M7 16.5v-4h6v4"/>
    </g>
    <g id="i-link" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.5 11.5a3 3 0 004.4.3l2.4-2.4a3 3 0 00-4.2-4.2l-1.3 1.3"/>
      <path d="M11.5 8.5a3 3 0 00-4.4-.3L4.7 10.6a3 3 0 004.2 4.2l1.3-1.3"/>
    </g>
  </defs>
</svg>

<!-- ── Rail ─────────────────────────────────────────────────────────────── -->
<nav class="rail" id="rail" aria-label="Workspaces">
  <div class="brand" title="SandboxOS">⇌</div>
  <!-- rail buttons are rendered by js/shell.js -->
</nav>

<!-- ── Topbar ───────────────────────────────────────────────────────────── -->
<header class="topbar">
  <button class="machine" id="machine-btn" title="Switch sandbox">
    <span class="dot" id="cell-dot"></span>
    <span class="slug" id="slug">…</span>
    <span class="caret">▼</span>
  </button>

  <button class="omni" id="omni">
    <svg width="13" height="13" viewBox="0 0 20 20"><use href="#i-search"/></svg>
    <span class="grow" style="text-align:left">Search files, run commands, jump anywhere…</span>
    <span class="kbd">⌘K</span>
  </button>

  <div class="spacer"></div>

  <div class="state">
    <span id="cell-state">connecting</span>
  </div>
  <button class="quiet icon" id="theme-btn" title="Toggle theme">
    <svg width="15" height="15" viewBox="0 0 20 20"><use href="#i-theme"/></svg>
  </button>
  <button class="quiet icon" id="dock-btn" title="Toggle activity dock">
    <svg width="15" height="15" viewBox="0 0 20 20"><use href="#i-activity"/></svg>
  </button>
</header>

<!-- ── Main ─────────────────────────────────────────────────────────────── -->
<main class="main">
  <div class="workspaces">

    <!-- Console ------------------------------------------------------- -->
    <section class="workspace active" id="ws-console" data-ws="console">
      <div class="console-pane">
        <div class="console-out" id="console-out"></div>
        <div class="console-prompt">
          <span class="ps" id="console-ps">▸</span>
          <input id="console-input" autocomplete="off" autocapitalize="off" spellcheck="false"
                 placeholder="command · ? natural language · :call server.tool {}" />
          <span class="mode" id="console-mode"></span>
        </div>
      </div>
    </section>

    <!-- Files --------------------------------------------------------- -->
    <section class="workspace" id="ws-files" data-ws="files">
      <div class="files-layout">
        <aside class="tree-pane">
          <div class="tree-toolbar">
            <input type="search" id="tree-filter" class="grow" placeholder="Filter" />
            <button class="quiet icon sm" id="file-new" title="New file"><svg width="13" height="13" viewBox="0 0 20 20"><use href="#i-plus"/></svg></button>
            <button class="quiet icon sm" id="file-upload" title="Upload"><svg width="13" height="13" viewBox="0 0 20 20"><use href="#i-up"/></svg></button>
            <button class="quiet icon sm" id="tree-refresh" title="Refresh"><svg width="13" height="13" viewBox="0 0 20 20"><use href="#i-refresh"/></svg></button>
            <input type="file" id="file-input" multiple class="hidden" />
          </div>
          <div class="tree" id="tree"></div>
        </aside>

        <div class="editor-pane">
          <div class="editor-tabs" id="editor-tabs"></div>
          <div class="editor-bar" id="editor-bar">
            <span class="path" id="editor-path">no file open</span>
            <span class="spacer"></span>
            <span id="editor-pos"></span>
            <button class="quiet icon sm" id="editor-save" title="Save (⌘S)" disabled><svg width="13" height="13" viewBox="0 0 20 20"><use href="#i-save"/></svg></button>
            <button class="quiet icon sm" id="editor-download" title="Download" disabled><svg width="13" height="13" viewBox="0 0 20 20"><use href="#i-down"/></svg></button>
          </div>
          <div class="editor-host" id="editor-host">
            <div class="editor-blank">
              <div class="empty">
                <div class="glyph">⇌</div>
                <h3>No file open</h3>
                <p>Pick a file from the tree, or press <span class="kbd">⌘K</span> and start typing a filename.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Shell (PTY) --------------------------------------------------- -->
    <section class="workspace" id="ws-shell" data-ws="shell">
      <div class="toolbar">
        <h2 style="font-size:var(--fs-md)">Interactive shell</h2>
        <span class="chip mono" id="pty-status">disconnected</span>
        <span class="spacer"></span>
        <button class="ghost sm" id="pty-connect">Connect</button>
        <button class="ghost sm" id="pty-disconnect" disabled>Disconnect</button>
      </div>
      <div id="pty-container" style="flex:1;min-height:0;padding:var(--s-2)"></div>
    </section>

    <!-- Agents -------------------------------------------------------- -->
    <section class="workspace" id="ws-agents" data-ws="agents">
      <div class="toolbar">
        <h2 style="font-size:var(--fs-md)">Agents</h2>
        <span class="spacer"></span>
        <button class="ghost sm" id="agents-refresh">Refresh</button>
        <button class="sm" id="agent-spawn-btn">
          <svg width="12" height="12" viewBox="0 0 20 20"><use href="#i-plus"/></svg> Spawn
        </button>
      </div>
      <div class="panel-body"><div class="cards" id="agents-list"></div></div>
    </section>

    <!-- Ports --------------------------------------------------------- -->
    <section class="workspace" id="ws-ports" data-ws="ports">
      <div class="toolbar">
        <h2 style="font-size:var(--fs-md)">Ports</h2>
        <span class="spacer"></span>
        <button class="ghost sm" id="ports-scan">Scan Cell</button>
        <button class="ghost sm" id="ports-refresh">Refresh</button>
        <button class="sm" id="port-expose-btn">
          <svg width="12" height="12" viewBox="0 0 20 20"><use href="#i-plus"/></svg> Expose
        </button>
      </div>
      <div class="panel-body" id="ports-body"><div class="cards" id="ports-list"></div></div>
      <div class="port-frame-wrap hidden" id="port-preview">
        <div class="editor-bar">
          <span class="path" id="port-preview-path"></span>
          <span class="spacer"></span>
          <button class="quiet icon sm" id="port-preview-reload" title="Reload"><svg width="13" height="13" viewBox="0 0 20 20"><use href="#i-refresh"/></svg></button>
          <button class="quiet icon sm" id="port-preview-open" title="Open in a new tab"><svg width="13" height="13" viewBox="0 0 20 20"><use href="#i-link"/></svg></button>
          <button class="quiet icon sm" id="port-preview-close" title="Close preview"><svg width="13" height="13" viewBox="0 0 20 20"><use href="#i-x"/></svg></button>
        </div>
        <iframe class="port-frame" id="port-frame" title="Port preview"></iframe>
      </div>
    </section>

    <!-- Jobs ---------------------------------------------------------- -->
    <section class="workspace" id="ws-jobs" data-ws="jobs">
      <div class="toolbar">
        <h2 style="font-size:var(--fs-md)">Processes &amp; schedule</h2>
        <span class="spacer"></span>
        <button class="ghost sm" id="jobs-refresh">Refresh</button>
        <button class="sm" id="proc-start-btn">
          <svg width="12" height="12" viewBox="0 0 20 20"><use href="#i-play"/></svg> Run process
        </button>
      </div>
      <div class="panel-body">
        <h3 class="dim" style="font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em;margin-bottom:var(--s-2)">Background processes</h3>
        <div class="cards" id="procs-list"></div>
        <h3 class="dim" style="font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em;margin:var(--s-5) 0 var(--s-2)">Scheduled jobs</h3>
        <div id="cron-list"></div>
      </div>
    </section>

    <!-- Apps ---------------------------------------------------------- -->
    <section class="workspace" id="ws-apps" data-ws="apps">
      <div class="toolbar">
        <h2 style="font-size:var(--fs-md)">Apps</h2>
        <span class="spacer"></span>
        <button class="ghost sm" id="apps-refresh">Refresh</button>
        <button class="sm" id="app-install-btn">
          <svg width="12" height="12" viewBox="0 0 20 20"><use href="#i-plus"/></svg> Install
        </button>
      </div>
      <div class="panel-body"><div class="cards" id="apps-list"></div></div>
    </section>

    <!-- Secrets ------------------------------------------------------- -->
    <section class="workspace" id="ws-secrets" data-ws="secrets">
      <div class="toolbar">
        <h2 style="font-size:var(--fs-md)">Secrets</h2>
        <span class="spacer"></span>
        <button class="ghost sm" id="secrets-refresh">Refresh</button>
        <button class="sm" id="secret-add-btn">
          <svg width="12" height="12" viewBox="0 0 20 20"><use href="#i-plus"/></svg> Add
        </button>
      </div>
      <div class="panel-body"><div id="secrets-list"></div></div>
    </section>

    <!-- Metrics ------------------------------------------------------- -->
    <section class="workspace" id="ws-metrics" data-ws="metrics">
      <div class="toolbar">
        <h2 style="font-size:var(--fs-md)">Metrics</h2>
        <span class="spacer"></span>
        <span class="chip mono" id="metrics-age">—</span>
        <button class="ghost sm" id="metrics-refresh">Refresh</button>
      </div>
      <div class="panel-body" id="metrics-body"></div>
    </section>

    <!-- Settings ------------------------------------------------------ -->
    <section class="workspace" id="ws-settings" data-ws="settings">
      <div class="toolbar">
        <h2 style="font-size:var(--fs-md)">Settings</h2>
      </div>
      <div class="panel-body" id="settings-body"></div>
    </section>

  </div>

  <!-- Activity dock ---------------------------------------------------- -->
  <aside class="dock" id="dock">
    <div class="panel-head">
      <h2>Activity</h2>
      <span class="sub" id="dock-mode">live</span>
      <span class="spacer"></span>
      <button class="quiet icon sm" id="dock-clear" title="Clear"><svg width="13" height="13" viewBox="0 0 20 20"><use href="#i-x"/></svg></button>
    </div>
    <div class="dock-filters">
      <select id="audit-server"><option value="">all servers</option></select>
      <select id="audit-kind">
        <option value="">all results</option>
        <option value="ok">ok</option>
        <option value="error">error</option>
        <option value="denied">denied</option>
      </select>
    </div>
    <ul class="audit-list" id="audit-list"></ul>
  </aside>
</main>

<!-- ── Statusbar ────────────────────────────────────────────────────────── -->
<footer class="statusbar">
  <span class="sb"><span class="dot" id="status-dot"></span><span id="status-cell">…</span></span>
  <span class="sb" id="status-backend">—</span>
  <span class="sb" id="status-procs"></span>
  <span class="sb" id="status-ports"></span>
  <span class="spacer"></span>
  <span class="sb" id="status-user">…</span>
  <button class="quiet" id="logout">Sign out</button>
</footer>

<div class="toasts" id="toasts"></div>
<div id="overlays"></div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
